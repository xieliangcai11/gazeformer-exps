[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gazelab"
version = "0.2.0"
description = "Robust sequential calibration for 2D screen gaze estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xieliangcai11" }]
dependencies = [
    "torch",
    "torchvision",
    "scipy",
    "timm",
    "easydict",
    "opencv-python",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
inference = ["mediapipe"]
logging = ["wandb", "tensorboard"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["gazelab*", "configs*", "tools*", "scripts*"]

[tool.setuptools.package-data]
"gazelab" = ["py.typed"]

[project.scripts]
gazelab-train = "scripts.train:main"
gazelab-predict = "gazelab.predict:main"